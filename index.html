<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Gobergo — el software para gestionar tu hermandad o cofradía: hermanos, cuotas, papeletas de sitio, cortejo, tesorería y comunicaciones." />
    <meta name="theme-color" content="#7B1520" />
    <title>Gobergo — Software para gestionar tu hermandad</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <!-- Fuentes para la web pública de cada hermandad (selector de tipografía) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Merriweather:wght@400;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@400;600;700&family=Raleway:wght@400;600;700&family=Poppins:wght@400;600;700&family=Lato:wght@400;700&family=Oswald:wght@400;600&family=Bebas+Neue&family=Dancing+Script:wght@500;700&display=swap" rel="stylesheet" />
    <script>
      // Aplica el tema guardado antes de pintar para evitar parpadeo
      (function () {
        try {
          var t = localStorage.getItem('cabildo-theme');
          if (t) document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
